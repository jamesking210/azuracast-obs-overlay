<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AzuraCast OBS Overlay</title>
  <link rel="stylesheet" href="/styles.css" />
  <script src="/config.js"></script>
</head>

<body class="overlay-page">
  <main class="stage" aria-label="OBS overlay">
    <div class="bar">
      <div class="station-block">
        <div id="stationLogoSlot" class="station-logo-slot" title="Station logo">
          <img id="stationLogo" class="station-logo" alt="" />
        </div>
        <div id="stationName" class="station">Station</div>
      </div>

      <div class="divider"></div>

      <div class="now-block">
        <div id="currentArtworkSlot" class="artwork-slot current-artwork-slot" title="Current track artwork">
          <img id="currentArtwork" class="track-artwork" alt="" />
        </div>
        <div id="currentTrack" class="track">Waiting for AzuraCast metadata...</div>
      </div>

      <div class="progress">
        <div id="elapsedTime" class="time elapsed-time">--:--</div>
        <div class="progress-bar">
          <div id="progressFill" class="progress-fill"></div>
        </div>
        <div id="remainingTime" class="time remaining-time">-:--</div>
      </div>

      <div class="divider"></div>

      <div class="coming-up">
        <span class="coming-label">COMING UP:</span>
        <div id="nextArtworkSlot" class="artwork-slot next-artwork-slot" title="Coming up artwork">
          <img id="nextArtwork" class="track-artwork" alt="" />
        </div>
        <span id="upNext" class="upnext-value">Station</span>
      </div>
    </div>
  </main>

  <audio id="stationAudio" preload="none" crossorigin="anonymous"></audio>

  <script src="/app.js"></script>
</body>
</html>
